<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 714" width="1280" height="714" role="img" aria-labelledby="t d"><title id="t">Design of the Light-Switch Experiment</title><desc id="d">Stage 1 measures each model's own preferences. Stage 2 is a swap test in three conditions: reactive mode, continuous mode and human participants. In each, an answer is chosen, half of the answers are swapped, and a yes/no test question is asked.</desc><rect x="0" y="0" width="1280" height="714" rx="14" fill="#fcfcfb"/><rect x="0.5" y="0.5" width="1279" height="713" rx="14" fill="none" stroke="#dddcd6"/><rect x="36" y="32" width="1208" height="92" rx="10" fill="#f1f0ec"/><text x="60" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#52514e" text-anchor="start" letter-spacing="1.2">STAGE 1</text><text x="60" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="650" fill="#0b0b0b" text-anchor="start" >Own preferences, measured before the test</text><text x="60" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" >Each model answers each of the 60 questions 20 times: 10 per order of the options.</text><text x="700" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="start" >own_p</text><text x="792" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" >how often the model itself picks an option</text><text x="700" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="start" >others_p</text><text x="792" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" >how often the three other models pick it</text><text x="1220" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0b0b0b" text-anchor="end" >4,800</text><text x="1220" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="end" >calls</text><text x="36" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#52514e" text-anchor="start" letter-spacing="1.2">STAGE 2</text><text x="110" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="650" fill="#0b0b0b" text-anchor="start" >The swap test: the same three steps in every condition</text><text x="250" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#52514e" text-anchor="start" letter-spacing="0.4">1  Choose</text><text x="542" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#52514e" text-anchor="start" letter-spacing="0.4">2  Swap</text><text x="834" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#52514e" text-anchor="start" letter-spacing="0.4">3  Test</text><text x="1220" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#52514e" text-anchor="end" letter-spacing="0.4">Trials</text><line x1="36" y1="218" x2="1244" y2="218" stroke="#dddcd6"/><rect x="36" y="236" width="5" height="118" rx="2.5" fill="#2a78d6"/><text x="56" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="650" fill="#0b0b0b" text-anchor="start" >Reactive mode</text><text x="56" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" >Language model.</text><text x="56" y="309" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" >Every question in</text><text x="56" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" >a separate call.</text><rect x="250" y="236" width="262" height="118" rx="10" fill="#e7f0fb"/><text x="268" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start" >60 separate calls</text><text x="268" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" >One question per call.</text><text x="268" y="317" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" >The answer is recorded.</text><path d="M518 295.0 H534" stroke="#8a8985" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M529 290.0 L535 295.0 L529 300.0" stroke="#8a8985" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="542" y="236" width="262" height="118" rx="10" fill="#e7f0fb"/><text x="560" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start" >30 of 60 answers swapped</text><text x="560" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" >The record is replaced</text><text x="560" y="317" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" >with the opposite option.</text><path d="M810 295.0 H826" stroke="#8a8985" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M821 290.0 L827 295.0 L821 300.0" stroke="#8a8985" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="834" y="236" width="262" height="118" rx="10" fill="#e7f0fb"/><text x="852" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start" >New call, no other history</text><text x="852" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" >Question + recorded answer:</text><text x="852" y="317" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" >“Is it the answer you gave?”</text><text x="1220" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0b0b0b" text-anchor="end" >1,200</text><text x="1220" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="end" >4 models × 5 sessions × 60</text><rect x="36" y="374" width="5" height="118" rx="2.5" fill="#eb6834"/><text x="56" y="404" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="650" fill="#0b0b0b" text-anchor="start" >Continuous mode</text><text x="56" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" >Language model.</text><text x="56" y="447" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" >All questions in</text><text x="56" y="466" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" >one dialogue.</text><rect x="250" y="374" width="262" height="118" rx="10" fill="#fdece4"/><text x="268" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start" >One dialogue</text><text x="268" y="436" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" >60 questions in a row.</text><text x="268" y="455" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" >Answers stay in the history.</text><path d="M518 433.0 H534" stroke="#8a8985" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M529 428.0 L535 433.0 L529 438.0" stroke="#8a8985" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="542" y="374" width="262" height="118" rx="10" fill="#fdece4"/><text x="560" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start" >30 of 60 answers swapped</text><text x="560" y="436" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" >Edited inside the history;</text><text x="560" y="455" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" >same questions as in reactive.</text><path d="M810 433.0 H826" stroke="#8a8985" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M821 428.0 L827 433.0 L821 438.0" stroke="#8a8985" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="834" y="374" width="262" height="118" rx="10" fill="#fdece4"/><text x="852" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start" >Copy of the dialogue</text><text x="852" y="436" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" >One copy per test question:</text><text x="852" y="455" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" >“Is it the answer you gave?”</text><text x="1220" y="426" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0b0b0b" text-anchor="end" >1,200</text><text x="1220" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="end" >4 models × 5 sessions × 60</text><rect x="36" y="512" width="5" height="118" rx="2.5" fill="#1baf7a"/><text x="56" y="542" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="650" fill="#0b0b0b" text-anchor="start" >Humans</text><text x="56" y="566" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" >Reference group.</text><text x="56" y="585" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" >Adult volunteers,</text><text x="56" y="604" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" >online questionnaire.</text><rect x="250" y="512" width="262" height="118" rx="10" fill="#e2f5ee"/><text x="268" y="546" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start" >Online questionnaire</text><text x="268" y="574" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" >20 of the 60 questions,</text><text x="268" y="593" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" >the same for everyone.</text><path d="M518 571.0 H534" stroke="#8a8985" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M529 566.0 L535 571.0 L529 576.0" stroke="#8a8985" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="542" y="512" width="262" height="118" rx="10" fill="#e2f5ee"/><text x="560" y="546" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start" >10 of 20 answers swapped</text><text x="560" y="574" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" >In the list of answers</text><text x="560" y="593" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" >shown back to the person.</text><path d="M810 571.0 H826" stroke="#8a8985" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M821 566.0 L827 571.0 L821 576.0" stroke="#8a8985" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="834" y="512" width="262" height="118" rx="10" fill="#e2f5ee"/><text x="852" y="546" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start" >Same test question</text><text x="852" y="574" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" >“Yes” or “No” button</text><text x="852" y="593" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" >for every answer.</text><text x="1220" y="564" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0b0b0b" text-anchor="end" >600</text><text x="1220" y="588" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="end" >30 people × 20</text><text x="36" y="664" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" >Outcome on every trial: “Yes” (this is my answer) or “No”. Half of the trials show a genuine answer, half a swapped one.</text><text x="36" y="683" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" >Models are told that records may have been altered; the human group gets no warning about swaps beforehand.</text></svg>