<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 596" width="1280" height="596" role="img" aria-labelledby="t d"><title id="t">Decision rules of the pre-registration</title><desc id="d">Schematic. An odds ratio between 0.5 and 2 is treated as too small to matter. For each hypothesis the figure shows hypothetical 90 percent posterior intervals that would count as supported, refuted or inconclusive.</desc><rect x="0" y="0" width="1280" height="596" rx="14" fill="#fcfcfb"/><rect x="0.5" y="0.5" width="1279" height="595" rx="14" fill="none" stroke="#dddcd6"/><text x="36" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="650" fill="#0b0b0b" text-anchor="start" >How each hypothesis is decided</text><text x="36" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" >Schematic with made-up intervals. No data have been collected.</text><rect x="620.0" y="108" width="180.0" height="410" fill="#f1f0ec"/><text x="710.0" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#52514e" text-anchor="middle" >too small to matter: OR 0.5 to 2</text><line x1="440.0" y1="108" x2="440.0" y2="518" stroke="#dddcd6" stroke-width="1"/><text x="440.0" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle" >⅛</text><line x1="530.0" y1="108" x2="530.0" y2="518" stroke="#dddcd6" stroke-width="1"/><text x="530.0" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle" >¼</text><line x1="620.0" y1="108" x2="620.0" y2="518" stroke="#dddcd6" stroke-width="1"/><text x="620.0" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle" >½</text><line x1="710.0" y1="108" x2="710.0" y2="518" stroke="#8a8985" stroke-width="1.5"/><text x="710.0" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle" >1</text><line x1="800.0" y1="108" x2="800.0" y2="518" stroke="#dddcd6" stroke-width="1"/><text x="800.0" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle" >2</text><line x1="890.0" y1="108" x2="890.0" y2="518" stroke="#dddcd6" stroke-width="1"/><text x="890.0" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle" >4</text><line x1="980.0" y1="108" x2="980.0" y2="518" stroke="#dddcd6" stroke-width="1"/><text x="980.0" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle" >8</text><text x="710.0" y="566" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle" >odds ratio (log scale): posterior median and 90% interval</text><text x="440" y="566" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8a8985" text-anchor="start" >← fewer “Yes”</text><text x="980" y="566" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8a8985" text-anchor="end" >more “Yes” →</text><text x="36" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#0b0b0b" text-anchor="start" >H1  Detection</text><text x="36" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" >Effect of the swap on “Yes”,</text><text x="36" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" >averaged over the two modes</text><text x="414" y="143" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#0b0b0b" text-anchor="end" >Supported</text><line x1="501.0264714601374" y1="138" x2="603.4017885976315" y2="138" stroke="#0b0b0b" stroke-width="2" stroke-linecap="round"/><circle cx="553.6730965250414" cy="138" r="5.5" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="2"/><text x="1006" y="143" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" >P(OR &lt; 1) ≥ .95 and median ≤ 0.5</text><text x="414" y="177" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#52514e" text-anchor="end" >Inconclusive</text><line x1="597.3615109703633" y1="172" x2="700.5772359199975" y2="172" stroke="#0b0b0b" stroke-width="2" stroke-linecap="round"/><circle cx="647.9306108550936" cy="172" r="5.5" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="2"/><text x="1006" y="177" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" >anything else</text><text x="414" y="211" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#0b0b0b" text-anchor="end" >Refuted</text><line x1="667.3461930500829" y1="206" x2="755.5301836756962" y2="206" stroke="#0b0b0b" stroke-width="2" stroke-linecap="round"/><circle cx="710.0" cy="206" r="5.5" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="2"/><text x="1006" y="211" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" >whole interval inside the band</text><line x1="36" y1="245.0" x2="1244" y2="245.0" stroke="#dddcd6"/><text x="36" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#0b0b0b" text-anchor="start" >H2  Self-knowledge</text><text x="36" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" >Effect of own_p (0 → 1),</text><text x="36" y="317" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" >holding others_p constant</text><text x="414" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#0b0b0b" text-anchor="end" >Supported</text><line x1="834.0660460928357" y1="270" x2="958.898127172668" y2="270" stroke="#0b0b0b" stroke-width="2" stroke-linecap="round"/><circle cx="896.3350395102259" cy="270" r="5.5" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="2"/><text x="1006" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" >P(OR &gt; 1) ≥ .95 and median ≥ 2</text><text x="414" y="309" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#52514e" text-anchor="end" >Inconclusive</text><line x1="728.1470475052686" y1="304" x2="838.9663466548495" y2="304" stroke="#0b0b0b" stroke-width="2" stroke-linecap="round"/><circle cx="782.6619429851844" cy="304" r="5.5" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="2"/><text x="1006" y="309" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" >anything else</text><text x="414" y="343" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#0b0b0b" text-anchor="end" >Refuted</text><line x1="663.6884144453218" y1="338" x2="771.0264714601374" y2="338" stroke="#0b0b0b" stroke-width="2" stroke-linecap="round"/><circle cx="716.3350395102259" cy="338" r="5.5" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="2"/><text x="1006" y="343" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" >whole interval inside the band</text><line x1="36" y1="377.0" x2="1244" y2="377.0" stroke="#dddcd6"/><text x="36" y="406" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#0b0b0b" text-anchor="start" >H3  The switch</text><text x="36" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" >Swap × mode interaction:</text><text x="36" y="449" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" >no difference is predicted</text><text x="414" y="407" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#0b0b0b" text-anchor="end" >Supported</text><line x1="659.9245986328053" y1="402" x2="758.2447610216188" y2="402" stroke="#0b0b0b" 